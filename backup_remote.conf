# Ruta de carpetas a respaldar (origen:nombre_remoto)
backup_paths=(
  "/foo/bar:foobar"
)

# Carpeta de destino en el servidor de backups
remote_backup_dir="/var/backups/sourcename"

# Dirección del servidor SSH
ssh_server="remote.server"

# Ruta a la clave privada para autenticación SSH
ssh_key="$HOME/.ssh/id_rsa"

# Nombre de usuario en el servidor SSH
ssh_user="remote_user"

# Días máximos entre copias completas (si no hay full reciente, se hace uno)
# full_backup_max_days=90

# Ciclos full+incrementales a conservar en el destino
# keep_full_cycles=2

# Exclusiones de tar (patrones). Array vacío = no excluir nada.
# Si no se define, el script usa node_modules, .cache, .npm y Trash.
# backup_excludes=(
#   "*/node_modules"
#   "*/.cache"
#   "*/.npm"
#   "*/.local/share/Trash"
# )

# No cruzar puntos de montaje (recomendado en WSL)
# one_file_system=true
